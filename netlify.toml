[build]
  publish = "dist"
  command = "npm run build"

# Proxy all /api requests to Render backend (bypasses browser CORS completely on Netlify)
[[redirects]]
  from = "/api/*"
  to = "https://api.advitacredit.com/api/:splat"
  status = 200
  force = true

# SPA fallback routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
